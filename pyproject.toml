[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-limit-guard"
version = "0.1.0"
description = "Local quota protection, checkpoints and resume coordination for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-limit-guard = "codex_limit_guard.cli:main"

[tool.setuptools.packages.find]
include = ["codex_limit_guard*"]

[tool.setuptools.package-data]
codex_limit_guard = ["skill/*.md"]
